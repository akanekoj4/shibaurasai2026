<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タッチコレクト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-shell">
    <main id="homeScreen" class="home-screen app-view">
      <section class="score-card" aria-labelledby="scoreTitle">
        <div class="score-content">
          <h2 id="scoreTitle">回収率</h2>
          <p id="score" class="score-number">0 / 3</p>
          <div class="progress-track" aria-hidden="true">
            <div id="scoreProgress" class="progress-fill"></div>
          </div>
        </div>
        <div class="character-slot" aria-label="キャラクター画像の配置予定エリア"></div>
      </section>

      <section class="collection-section" aria-labelledby="itemListTitle">
        <h2 id="itemListTitle">アイテム一覧</h2>
        <div id="items" class="item-grid"></div>
      </section>
    </main>

    <main id="catalogScreen" class="catalog-screen app-view" aria-hidden="true" aria-labelledby="catalogTitle">
      <h1 id="catalogTitle" class="sr-only">図鑑</h1>
      <img class="catalog-book" src="images/figma-catalog-book-figma.svg" alt="" aria-hidden="true">
      <img class="catalog-bookmark" src="images/figma-catalog-bookmark-figma.svg" alt="" aria-hidden="true">
      <section class="catalog-index" aria-label="図鑑の目次">
        <div id="catalogCards" class="catalog-grid"></div>
      </section>
    </main>

    <main id="catalogDetailScreen" class="catalog-detail-screen app-view" aria-hidden="true" aria-labelledby="catalogDetailTitle">
      <img id="catalogDetailBook" class="catalog-detail-book" src="images/figma-catalog-book-figma.svg" alt="" aria-hidden="true">
      <img id="catalogDetailBookmark" class="catalog-detail-bookmark" src="images/figma-catalog-bookmark-figma.svg" alt="" aria-hidden="true">
      <h1 id="catalogDetailTitle" class="catalog-detail-title"></h1>
      <span class="catalog-detail-image-frame">
        <img id="catalogDetailImage" class="catalog-detail-image" alt="">
      </span>
      <section class="catalog-detail-description" aria-labelledby="catalogDetailDescriptionLabel">
        <h2 id="catalogDetailDescriptionLabel" class="catalog-detail-description-label">説明</h2>
        <p id="catalogDetailDescriptionText" class="catalog-detail-description-text"></p>
      </section>
      <div id="catalogDetailBadge" class="catalog-detail-badge" aria-hidden="true">
        <img id="catalogDetailBadgeOuter" class="catalog-detail-badge-outer" alt="">
        <img id="catalogDetailBadgeInner" class="catalog-detail-badge-inner" alt="">
        <span id="catalogDetailBadgeText" class="catalog-detail-badge-text"></span>
      </div>
    </main>

    <section id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" aria-hidden="true">
      <div class="get-card">
        <img class="get-card-shadow" src="images/figma-get-card-shadow-figma.svg" alt="" aria-hidden="true">
        <img class="get-card-ribbon" src="images/figma-get-card-ribbon-figma.svg" alt="" aria-hidden="true">
        <span class="get-card-label" aria-hidden="true">GET</span>
        <span class="get-item-image-frame">
          <img id="popupItemImage" class="get-item-image" alt="">
        </span>
        <p id="popupTitle" class="get-item-message" aria-live="polite"></p>
        <button id="popupCloseButton" class="get-card-close" type="button">OK！</button>
      </div>
    </section>

    <!-- ここボタンなのでいらない -->
    <div class="legacy-controls" aria-hidden="true">
      <button type="button" id="getWalletButton" tabindex="-1">財布を拾う</button>
      <button type="button" id="getKeyButton" tabindex="-1">鍵を拾う</button>
      <button type="button" id="getBearButton" tabindex="-1">ぬいぐるみを拾う</button>
      <button type="button" id="resetButton" tabindex="-1">データをリセット</button>
    </div>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <img class="nav-vectors" src="images/figma-bottom-nav-icons-figma.svg" alt="" aria-hidden="true">
      <a class="nav-item active" href="#home" data-view="home" aria-current="page">
        <span>ホーム</span>
      </a>
      <a class="nav-item" href="#catalog" data-view="catalog">
        <span>図鑑</span>
      </a>
      <a class="nav-item" href="#map" data-view="map">
        <span>マップ</span>
      </a>
    </nav>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
