<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タッチコレクト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-shell">
    <main class="home-screen">
      <section class="score-card" aria-labelledby="scoreTitle">
        <div class="score-content">
          <h2 id="scoreTitle">回収率</h2>
          <p id="score" class="score-number">0 / 3</p>
          <div class="progress-track" aria-hidden="true">
            <div id="scoreProgress" class="progress-fill"></div>
          </div>
        </div>
        <div class="character-slot" aria-label="キャラクター画像の配置予定エリア"></div>
      </section>

      <section class="collection-section" aria-labelledby="itemListTitle">
        <h2 id="itemListTitle">アイテム一覧</h2>
        <div id="items" class="item-grid"></div>
      </section>
    </main>

    <section id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" aria-hidden="true">
      <div class="get-card">
        <img class="get-card-shadow" src="images/figma-get-card-shadow.svg" alt="" aria-hidden="true">
        <img class="get-card-ribbon" src="images/figma-get-card-ribbon.svg" alt="" aria-hidden="true">
        <span class="get-card-label" aria-hidden="true">GET</span>
        <span class="get-item-image-frame">
          <img id="popupItemImage" class="get-item-image" alt="">
        </span>
        <p id="popupTitle" class="get-item-message" aria-live="polite"></p>
        <button id="popupCloseButton" class="get-card-close" type="button">OK！</button>
      </div>
    </section>

    <div class="legacy-controls" aria-label="開発用コントロール">
      <button type="button" id="getWalletButton" hidden>財布を拾う</button>
      <button type="button" id="getKeyButton" hidden>鍵を拾う</button>
      <button type="button" id="getBearButton" hidden>ぬいぐるみを拾う</button>
      <button type="button" id="resetButton">開発用：データをリセット</button>
    </div>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <img class="nav-vectors" src="images/figma-bottom-nav-icons.svg" alt="" aria-hidden="true">
      <a class="nav-item active" href="#" aria-current="page">
        <span>ホーム</span>
      </a>
      <a class="nav-item" href="#">
        <span>図鑑</span>
      </a>
      <a class="nav-item" href="#">
        <span>マップ</span>
      </a>
    </nav>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
